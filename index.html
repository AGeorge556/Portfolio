<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andrew George — Full-Stack Developer in Cairo, Egypt</title>
    <meta name="description" content="Full-stack developer in Cairo, Egypt building web and mobile apps with React, TypeScript, Next.js, Flutter and Supabase. Projects, experience and certifications." />
    <meta name="author" content="Andrew George" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#0f0e1a" />

    <!-- Tab icon, home-screen icons -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (LinkedIn, WhatsApp, Slack, X, Facebook) -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Andrew George" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Andrew George — Full-Stack Developer" />
    <meta property="og:description" content="React, TypeScript, Next.js, Flutter and Supabase developer based in Cairo, Egypt." />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Andrew George, Full-Stack Developer, Cairo, Egypt" />
    <meta property="profile:first_name" content="Andrew" />
    <meta property="profile:last_name" content="George" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Andrew George — Full-Stack Developer" />
    <meta name="twitter:description" content="React, TypeScript, Next.js, Flutter and Supabase developer based in Cairo, Egypt." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <!-- Structured data: lets search engines show a person card -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Andrew George",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/assets/profile.jpg",
        "jobTitle": "Full-Stack Developer",
        "address": { "@type": "PostalAddress", "addressLocality": "Cairo", "addressCountry": "EG" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Nile University" },
        "knowsAbout": ["React", "TypeScript", "Next.js", "JavaScript", "Tailwind CSS", "Flutter", "Supabase", "Node.js"],
        "sameAs": [
          "https://github.com/AGeorge556",
          "https://www.linkedin.com/in/andrew-george-610535309"
        ]
      }
    </script>
    <!-- Preconnect to font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DNS prefetch for project image CDN -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Non-render-blocking font load -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&family=Space+Grotesk:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
